**.metaReinjections:vector(removeRepeats).vector-recording = true
**.metaReinjections.result-recording-modes = vector(removeRepeats)
**.mpOrbForwardQueueingDelay.statistic-recording = true
**.mpOrbForwardQueueingDelay:vector(removeRepeats).vector-recording = true
**.mpOrbForwardQueueingDelay.result-recording-modes = vector(removeRepeats)
**.mpOrbReverseQueueingDelay.statistic-recording = true
**.mpOrbReverseQueueingDelay:vector(removeRepeats).vector-recording = true
**.mpOrbReverseQueueingDelay.result-recording-modes = vector(removeRepeats)
**.intSchedulerScore.statistic-recording = true
**.intSchedulerScore:vector(removeRepeats).vector-recording = true
**.intSchedulerScore.result-recording-modes = vector(removeRepeats)
**.intSchedulerBurstBytes.statistic-recording = true
**.intSchedulerBurstBytes:vector(removeRepeats).vector-recording = true
**.intSchedulerBurstBytes.result-recording-modes = vector(removeRepeats)
**.intSchedulerFreshFeedback.statistic-recording = true
**.intSchedulerFreshFeedback:vector(removeRepeats).vector-recording = true
**.intSchedulerFreshFeedback.result-recording-modes = vector(removeRepeats)
**.intSchedulerProbe.statistic-recording = true
**.intSchedulerProbe:vector(removeRepeats).vector-recording = true
**.intSchedulerProbe.result-recording-modes = vector(removeRepeats)
**.mpOrbPressureWeight.statistic-recording = true
**.mpOrbPressureWeight:vector(removeRepeats).vector-recording = true
**.mpOrbPressureWeight.result-recording-modes = vector(removeRepeats)
**.mpOrbPressureSubflowRate.statistic-recording = true
**.mpOrbPressureSubflowRate:vector(removeRepeats).vector-recording = true
**.mpOrbPressureSubflowRate.result-recording-modes = vector(removeRepeats)
**.mpOrbPressureConnectionRate.statistic-recording = true
**.mpOrbPressureConnectionRate:vector(removeRepeats).vector-recording = true
**.mpOrbPressureConnectionRate.result-recording-modes = vector(removeRepeats)
**.queueLength.statistic-recording = true
**.queueLength:vector(removeRepeats).vector-recording = true
**.queueLength.result-recording-modes = vector(removeRepeats)
**.ppp[*].queue.packetCapacity = 173
**.statistic-recording = false
**.scalar-recording = false
**.vector-recording = false
**.bin-recording = false

# Fixed 173-packet queues: one 100 Mbps / 20 ms BDP in both RTT profiles.
**.tcp.typename = "MpOrb"
**.tcp.tcpAlgorithmClass = "MpOrbPressure"
*.backgroundClient[*].tcp.conn-*.schedulerMode = "default"
*.backgroundServer[*].tcp.conn-*.schedulerMode = "default"
**.p1Ingress.ppp[0].queue.typename = "PintQueue"
**.p2Ingress.ppp[0].queue.typename = "PintQueue"
**.ppp[*].queue.typename = "DropTailQueue"
**.ppp[*].queue.dropperClass = "inet::queueing::PacketAtCollectionEndDropper"
**.additiveIncreasePercent = 0.05
**.eta = 0.95
**.alpha = 0.03
**.fixedAvgRTTVal = 0s
**.pintFeedbackProbability = 1
**.pintSeparateQueueingDelay = true
**.mpOrbPressureDecreaseGain = 1
**.mpOrbPressureMaxDecreaseFraction = 0.25
**.mpOrbPressureProbeIntervalRtts = 4

[Config Pressure_equal_default_Run1]
description = "MpOrbPressure; default; RTT 20/20 ms; run 1"
seed-set = 1
*.path1Rtt = 20ms
*.path2Rtt = 20ms
*.client[0].tcp.conn-*.schedulerMode = "default"
*.server[0].tcp.conn-*.schedulerMode = "default"
*.client[0].app[0].tOpen = 0.542824s
*.client[0].app[0].tSend = 0.542824s
*.backgroundClient[*].app[0].tOpen = 40s
*.backgroundClient[*].app[0].tSend = 40s
output-vector-file = "results/Pressure_equal_default_Run1-#0.vec"
output-scalar-file = "results/Pressure_equal_default_Run1-#0.sca"

