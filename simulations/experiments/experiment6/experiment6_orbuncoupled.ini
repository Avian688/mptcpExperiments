[General]
ned-path = ../..:../../../src:../../../../mptcp/simulations:../../../../mptcp/src:../../../../mporb/simulations:../../../../mporb/src:../../../../orbtcp/simulations:../../../../orbtcp/src:../../../../cubic/simulations:../../../../cubic/src:../../../../tcpPaced/simulations:../../../../tcpPaced/src:../../../../tcpGoodputApplications/simulations:../../../../tcpGoodputApplications/src:../../../../inet4.5/src
network = mptcpexperiments.simulations.experiments.experiment6.redistribution
sim-time-limit = 150s
record-eventlog = false
cmdenv-express-mode = true
cmdenv-event-banners = false
**.cmdenv-log-level = off
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/><autoroute metric='delay'/></config>")
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.optimizeRoutes = false
**.tcp.typename = "MpOrb"
**.tcp.tcpAlgorithmClass = "MpOrbUncoupled"
**.schedulerMode = "defaultCwnd"
**.startAllSubflowsAtBeginning = true
**.subflowStartTimes = ""
**.tcp.advertisedWindow = 200000000
**.tcp.windowScalingSupport = true
**.tcp.windowScalingFactor = -1
**.tcp.increasedIWEnabled = true
**.tcp.delayedAcksEnabled = false
**.tcp.timestampSupport = true
**.tcp.ecnWillingness = false
**.tcp.nagleEnabled = true
**.tcp.sackSupport = true
**.tcp.updatedSackEnabled = true
**.tcp.stopOperationTimeout = 4000s
**.tcp.mss = 1448
**.tcp.sendQueueLimit = 4MiB
# Fixed startup threshold: half of the 100 Mbps / 20 ms reference BDP.
**.tcp.initialSsthresh = 124528
**.additiveIncreasePercent = 0.05
**.eta = 0.95
**.alpha = 0.03
**.fixedAvgRTTVal = 0s
# Exact PINT values/counts, full ACK feedback; estimator dynamics remain enabled.
**.pintBits = 0
**.pintFlowCountBits = 0
**.flowCountSketchEnabled = false
**.pintFeedbackProbability = 1
**.pintSeparateQueueingDelay = true
**.goodputInterval = 0.5s
**.throughputInterval = 0.5s
*.linkCapacity = 100Mbps
*.pathRtt = 20ms
**.tcp.subflowInterfaceBinding = true
*.client[*].forwarding = false
*.server[*].forwarding = false
*.client[0].numApps = 1
*.client[0].app[0].typename = "MpTcpSessionApp"
