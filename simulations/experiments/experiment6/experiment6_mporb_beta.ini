[General]
ned-path = ../..:../../../src:../../../../mptcp/simulations:../../../../mptcp/src:../../../../mporb/simulations:../../../../mporb/src:../../../../orbtcp/simulations:../../../../orbtcp/src:../../../../cubic/simulations:../../../../cubic/src:../../../../tcpPaced/simulations:../../../../tcpPaced/src:../../../../tcpGoodputApplications/simulations:../../../../tcpGoodputApplications/src:../../../../inet4.5/src
network = mptcpexperiments.simulations.experiments.experiment6.sharedleopaths
sim-time-limit = 300s
record-eventlog = false
cmdenv-express-mode = true
cmdenv-event-banners = false
**.cmdenv-log-level = off
*.configurator.config = xml("<config><interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/><autoroute metric='delay'/></config>")
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.optimizeRoutes = false
**.tcp.typename = "MpOrb"
**.tcp.tcpAlgorithmClass = "MpOrbSemiCoupledBeta"
**.schedulerMode = "defaultCwnd"
**.startAllSubflowsAtBeginning = true
**.subflowStartTimes = ""
**.tcp.advertisedWindow = 200000000
**.tcp.windowScalingSupport = true
**.tcp.windowScalingFactor = -1
**.tcp.increasedIWEnabled = true
**.tcp.delayedAcksEnabled = false
**.tcp.timestampSupport = true
**.tcp.ecnWillingness = false
**.tcp.nagleEnabled = true
**.tcp.sackSupport = true
**.tcp.updatedSackEnabled = true
**.tcp.stopOperationTimeout = 4000s
**.tcp.mss = 1448
**.tcp.sendQueueLimit = 4MiB
# Fixed startup threshold: half of the 100 Mbps / 20 ms reference BDP.
**.tcp.initialSsthresh = 124528
**.additiveIncreasePercent = 0.05
**.eta = 0.95
**.alpha = 0.03
**.fixedAvgRTTVal = 0s
# Exact PINT values/counts, full ACK feedback; estimator dynamics remain enabled.
**.pintBits = 0
**.pintFlowCountBits = 0
**.flowCountSketchEnabled = false
**.pintFeedbackProbability = 1
**.pintSeparateQueueingDelay = true
**.goodputInterval = 0.5s
**.throughputInterval = 0.5s
*.client[*].numApps = 1
*.client[*].app[0].typename = "MpTcpSessionApp"
*.server[*].numApps = 1
*.server[*].app[0].typename = "MpTcpSinkApp"
*.client[*].app[0].tClose = -1s
*.client[*].app[0].sendBytes = 1MiB
*.client[*].app[0].dataTransferMode = "bytecount"
*.client[*].app[0].connectPort = 1000
*.server[*].app[0].localPort = 1000
*.server[*].app[0].serverThreadModuleType = "tcpgoodputapplications.applications.tcpapp.TcpGoodputSinkAppThread"
*.client[0].app[0].numberOfSubflows = 4
*.client[0].tcp.conn-*.numberOfSubflows = 4
*.server[0].app[0].numberOfSubflows = 4
*.server[0].tcp.conn-*.numberOfSubflows = 4
*.client[0].app[0].connectAddress = "server[0]"
*.client[0].tcp.subflowRemoteAddresses = "server[0]>router2[0] server[0]>router2[1] server[0]>router2[2] server[0]>router2[3]"
*.client[1].app[0].numberOfSubflows = 4
*.client[1].tcp.conn-*.numberOfSubflows = 4
*.server[1].app[0].numberOfSubflows = 4
*.server[1].tcp.conn-*.numberOfSubflows = 4
*.client[1].app[0].connectAddress = "server[1]"
*.client[1].tcp.subflowRemoteAddresses = "server[1]>router2[0] server[1]>router2[1] server[1]>router2[4] server[1]>router2[5]"
*.client[2].app[0].numberOfSubflows = 4
*.client[2].tcp.conn-*.numberOfSubflows = 4
*.server[2].app[0].numberOfSubflows = 4
*.server[2].tcp.conn-*.numberOfSubflows = 4
*.client[2].app[0].connectAddress = "server[2]"
*.client[2].tcp.subflowRemoteAddresses = "server[2]>router2[2] server[2]>router2[3] server[2]>router2[6] server[2]>router2[7]"
*.router1[0].ppp[2].queue.typename = "PintQueue"
*.router1[1].ppp[2].queue.typename = "PintQueue"
*.router1[2].ppp[2].queue.typename = "PintQueue"
*.router1[3].ppp[2].queue.typename = "PintQueue"
*.router1[4].ppp[1].queue.typename = "PintQueue"
*.router1[5].ppp[1].queue.typename = "PintQueue"
*.router1[6].ppp[1].queue.typename = "PintQueue"
